-   name: import_dicom
    aliases: []
    path: qx_utilities.general.dicom.import_dicom
    language: python
    call: import_dicom [sessionsfolder=.] [sessions=""] [masterinbox=<sessionsfolder>/inbox/MR] [check=any] [pattern="(?P<packet_name>.*?)(?:\.zip$|\.tar$|.tgz$|\.tar\..*$|$)"]
