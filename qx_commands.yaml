    -   name: hcp_bold_movref
        type: str
        default: independent
        description: What reference to use for movement correction ('independent', 'first'). This parameter is only valid
            when running HCPpipelines using the LegacyStyleData processing mode!
    -   name: hcp_bold_seimg
        type: str
        default: independent
        description: What image to use for spin-echo distortion correction ('independent' | 'first'). This parameter is only
            valid when running HCPpipelines using the LegacyStyleData processing mode!
