    aliases: []
    path: qx_utilities.hcp.process_hcp.hcp_task_fmri_analysis
    language: python
    call: hcp_task_fmri_analysis [... processing options]
    description: Run the Task fMRI analysis step of the HCP Pipeline (TaskfMRIAnalysis.sh).
    type: processing.session
    args:
    -   name: sinfo
        type: null
        default: null
        description: null
    -   name: options
        type: null
        default: null
        description: null
    -   name: overwrite
        type: null
        default: null
        description: null
    -   name: thread
        type: null
        default: null
        description: null
    options:
    -   name: batchfile
        type: str
        default: ''
        description: The batch.txt file with all the session's information.
    -   name: sessionsfolder
        type: str
        default: .
        description: The path to the study/sessions folder, where the imaging data is supposed to go.
    -   name: parsessions
        type: int
        default: '1'
        description: How many sessions to run in parallel.
    -   name: hcp_suffix
        type: str
        default: ''
        description: Specifies a suffix to the session id if multiple variants are run, empty otherwise.
    -   name: logfolder
        type: str
        default: ''
        description: The path to the folder where logs are to be stored, if other than default.
    -   name: hcp_task_lvl1tasks
        type: str
        default: ''
        description: List of task fMRI scan names, which are the prefixes of the time series filename for the TaskName task.
            Multiple task fMRI scan names should be provided as a comma separated list.
    -   name: hcp_task_lvl1fsfs
        type: str
        default: ''
        description: List of design names, which are the prefixes of the fsf filenames for each scan run. Should contain same
            number of design files as time series images in --hcp_task_lvl1tasks option (N-th design will be used for N-th
            time series image). Provide a comma separated list of design names. If no value is passed to --hcp_task_lvl1fsfs,
            the value will be set to --hcp_task_lvl1tasks.
    -   name: hcp_task_lvl2task
        type: str
        default: NONE
        description: Name of Level2 subdirectory in which all Level2 feat directories are written for TaskName.
    -   name: hcp_task_lvl2fsf
        type: str
        default: ''
        description: Prefix of design.fsf filename for the Level2 analysis for TaskName. If no value is passed to --hcp_task_lvl2fsf,
            the value will be set to the same list passed to --hcp_task_lvl2task.
    -   name: hcp_task_summaryname
        type: str
        default: NONE
        description: Naming convention for single-subject summary directory. Mandatory when running Level1 analysis only,
            and should match naming of Level2 summary directories. Default when running Level2 analysis is derived from --hcp_task_lvl2task
            and --hcp_task_lvl2fsf options 'tfMRI_TaskName/DesignName_TaskName'.
    -   name: hcp_task_confound
        type: str
        default: NONE
        description: Confound matrix text filename (e.g., output of fsl_motion_outliers). Assumes file is in <SubjectID>/MNINonLinear/Results/<ScanName>.
    -   name: hcp_bold_smoothFWHM
        type: int
        default: '2'
        description: Smoothing FWHM that matches what was used in the fMRISurface pipeline.
    -   name: hcp_bold_final_smoothFWHM
        type: int
        default: '2'
        description: Value (in mm FWHM) of total desired smoothing, reached by calculating the additional smoothing required
            and applying that additional amount to data previously smoothed in fMRISurface. Default=2, which is no additional
            smoothing above HCP minimal preprocessing pipelines outputs.
    -   name: hcp_task_highpass
        type: int
        default: '200'
        description: Apply additional highpass filter (in seconds) to time series and task design. This is above and beyond
            temporal filter applied during preprocessing. To apply no additional filtering, set to 'NONE'.
    -   name: hcp_task_lowpass
        type: str
        default: NONE
        description: Apply additional lowpass filter (in seconds) to time series and task design. This is above and beyond
            temporal filter applied during preprocessing. Low pass filter is generally not advised for Task fMRI analyses.
    -   name: hcp_task_procstring
        type: str
        default: NONE
        description: String value in filename of time series image, specifying the additional processing that was previously
            applied (e.g., FIX-cleaned data with 'hp2000_clean' in filename).
    -   name: hcp_regname
        type: str
        default: MSMSulc
        description: Name of surface registration technique.
    -   name: hcp_grayordinatesres
        type: int
        default: '2'
        description: Value (in mm) that matches value in 'Atlas_ROIs' filename.
    -   name: hcp_lowresmesh
        type: int
        default: '32'
        description: Value (in mm) that matches surface resolution for fMRI data.
    -   name: hcp_task_vba
        type: flag
        default: null
        description: A flag for using VBA. Only use this flag if you want unconstrained volumetric blurring of your data,
            otherwise set to NO for faster, less biased, and more senstive processing (grayordinates results do not use unconstrained
            volumetric blurring and are always produced). This flag is not set by defult.
    -   name: hcp_task_parcellation
        type: str
        default: NONE
        description: Name of parcellation scheme to conduct parcellated analysis. Default setting is NONE, which will perform
            dense analysis instead. Non-greyordinates parcellations are not supported because they are not valid for cerebral
            cortex. Parcellation supersedes smoothing (i.e. no smoothing is done).
    -   name: hcp_task_parcellation_file
        type: str
        default: NONE
        description: Absolute path to the parcellation dlabel file.
    returns: []
    origin: core
