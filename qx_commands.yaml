    -   name: hcp_longitudinal_subject
        type: str
        default: ''
        description: The subject id of the longitudinal subject. Mandatory for longitudinal processing.
    -   name: hcp_longitudinal_sessions
        type: str
        default: ''
        description: A comma separated list of sessions for a given subject. Mandatory for longitudinal processing.
