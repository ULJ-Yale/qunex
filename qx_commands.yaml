    -   name: hcp_nogpu
        type: flag
        default: null
        description: If specified, use the non-GPU-enabled version of eddy. The flag is not set by default.
    -   name: hcp_dwi_even_slices
        type: flag
        default: null
        description: If set will ensure the input images to FSL's topup and eddy have an even number of slices by removing
            one slice if necessary. This behaviour used to be the default, but is now optional, because discarding a slice
            is incompatible with using slice-to-volume correction in FSL's eddy. The flag is not set by default.
    -   name: hcp_dwi_posdata
        type: str
        default: ''
        description: Overrides the automatic QuNex's setup for the posData HCP pipelines' parameter. Provide a comma separated
            list of images with pos data.
    -   name: hcp_dwi_negdata
        type: str
        default: ''
        description: Overrides the automatic QuNex's setup for the negData HCP pipelines' parameter. Provide a comma separated
            list of images with neg data.
    -   name: hcp_dwi_dummy_bval_bvec
        type: flag
        default: null
        description: QuNex will create dummy bval and bvec files if they do not yet exist. Mainly useful when using distortion
            maps as part of the input data.
    -   name: hcp_longitudinal_template
        type: str
        default: base
        description: Name of the longitudinal template.
    returns: []
    origin: core
