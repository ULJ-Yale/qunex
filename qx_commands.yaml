-   name: change_dicom_files
    aliases: []
    path: qx_utilities.general.dicomdeid.change_dicom_files
    language: python
    call: change_dicom_files [folder=.] [paramfile=deidparam.txt] [archivefile=archive.csv] [outputfolder=None] [extension=""]
        [replacementdate=]
    description: Change all the dicom files in the specified folder according the `paramfile`.
    type: utility
    args:
    -   name: folder
        type: str
        default: .
        description: The base folder to search for DICOM files. The command will try to locate all valid DICOM files within
            the specified folder and its subfolders.
    -   name: paramfile
        type: str
        default: deidparam.txt
        description: The path to the parameter file that specifies what actions to perform on the dicom fields.
    -   name: archivefile
        type: str
        default: archive.csv
        description: The path to the file in which values to be archived are to be stored.
    -   name: outputfolder
        type: str
        default: null
        description: The optional path to the folder to which the modified dicom files are to be saved. If not specified,
            the dicom files are changed in place (overwritten).
    -   name: extension
        type: str
        default: null
        description: An optional extension to be added to each modified dicom file name. The extension can be applied only
            when files are copied to the outputfolder.
    -   name: replacementdate
        type: str
        default: null
        description: The date to replace all instances of StudyDate in the file. Looks at all DICOM fields with string values,
            and replaces the substring matching StudyDate with either a provided date, or a randomly generated date.
    options: []
    returns: []
    origin: core
