        description: Whether to overwrite existing data (yes) or not (no). Note that previous data is deleted before the run,
            so in the case of a failed command run, previous results are lost.
    -   name: thread
        type: null
        default: null
        description: null
    options:
    -   name: batchfile
        type: str
        default: ''
        description: The batch.txt file with all the sessions information.
    -   name: sessions
        type: str
        default: ''
        description: A list of sessions to process.
    -   name: sessionsfolder
        type: str
        default: null
        description: The path to the study/sessions folder, where the imaging data is supposed to go.
    -   name: parsessions
        type: int
        default: '1'
        description: How many sessions to run in parallel.
    -   name: parelements
        type: int
        default: '1'
        description: How many elements (e.g. bolds) to run in parallel.
    -   name: logfolder
        type: str
        default: ''
        description: The path to the folder where logs are to be stored, if other than default.
    -   name: bolds
        type: str
        default: rest
        description: Which bold images to process. You can select bolds through their number, name or task (e.g. rest), you
            can chain multiple conditions together by providing a comma separated list. By default, rest bolds will be used.
    -   name: nifti_tail
        type: str
        default: null
        description: The tail of BOLD NIfTI images to use. For example, if bold is rfMRI_REST1_AP and tail is _hp0_clean_rclean_tclean,
            then the HCP processed BOLD image that will be used is rfMRI_REST1_AP_hp0_clean_rclean_tclean.nii.gz.
    -   name: despecklepasses
        type: int
        default: null
        description: Detect and refit suspect correlations to disambiguate peak location in PASSES passes. Set to 0 to disable.
    -   name: filterband
        type: str
        default: null
        description: 'Filter data and regressors to specific band. Use None to disable filtering. Ranges and options are:
            vlf: 0.0-0.009Hz, lfo: 0.01-0.15Hz, cardiac: 0.66-3.0Hz, hrv_ulf: 0.0-0.0033Hz, hrv_vlf: 0.0033-0.04Hz, hrv_lf:
            0.04-0.15Hz, hrv_hf: 0.15-0.4Hz, hrv_vhf: 0.4-0.5Hz, lfo_legacy: 0.01-0.15Hz, lfo_tight: 0.01-0.1Hz, resp.'
    -   name: searchrange
        type: str
        default: null
        description: Space separated limits for a range of lags.
    -   name: nprocs
        type: int
        default: null
        description: Number of worker processes for multiprocessing. Setting to less than 1 sets the number of worker processes
            to number of CPUs.
    -   name: nofitfilt
        type: flag
        default: null
        description: Do not zero out peak fit values if fit fails.
    -   name: similaritymetric
        type: str
        default: null
        description: Similarity metric for finding delay values. Choices are correlation, mutualinfo, and hybrid.
    -   name: ampthresh
        type: str
        default: null
        description: For refinement, exclude voxels with correlation coefficients less than the set value. Note htat ampthresh
            will automatically be set to the p<0.05 significance level determined by the --numnull option if --nomnull is
            set greater than 0 and this is not manually specified.
    -   name: outputlevel
        type: str
        default: null
        description: The level of file output produced. "min" produces only absolutely essential files, "less" adds in the
            sLFO filtered data (rather than just filter efficacy metrics), "normal" saves what you would typically want around
            for interactive data exploration, "more" adds files that are sometimes useful, and "max" outputs anything you
            might possibly want. Selecting "max" will produce ~3x your input datafile size as output.
    -   name: spatialfilt
        type: str
        default: null
        description: Spatially filter fMRI data prior to analysis using the set value in mm. Set negative to have rapidtide
            set it to half the mean voxel dimension (a rule of thumb for a good value). Set to 0 to disable.
    -   name: simcalcrange
        type: str
        default: null
        description: 2 space separated values that limit correlation calculation to data between them in the fmri file. If
            the end value is set to -1, analysis will go to the last time-point. Negative start values wil be set to 0. Default
            is to use all time-points.
    -   name: brainmask
        type: str
        default: null
        description: This specifies the valid brain voxels. No voxels outside of this will be used for global mean calculation,
            correlation, refinement, offset calculation, or denoising. Will be set to BOLD's brainmask_fs.2.nii.gz from HCP
            pipelines by default if it file exists. Set to "None" to disable brain mask.
    -   name: graymattermask
        type: str
        default: null
        description: This specifies a gray matter mask registered to the input functional data. If not set flirt will be used
            to automatically calculate 2 mm aparc+aseg. Set to "None" to disable gray matter mask.
    -   name: whitemattermask
        type: str
        default: null
        description: This specifies a white matter mask registered to the input functional data. If not set flirt will be
            used to automatically calculate 2 mm aparc+aseg. Set to "None" to disable white matter mask.
    -   name: refineexclude
        type: str
        default: null
        description: Do not use voxels in the provided file for regressor refinement. By default BOLD's dropouts from HCP
            pipelines will be used if they exist. Set to "None" to disable refinement exclusion.
    -   name: nodenoise
        type: flag
        default: null
        description: Turn off regression filtering to remove delayed regressor from each voxel (disables output of fitNorm).
            Does not perform denoising, only calculates the maps.
    -   name: rapidtide_extra_args
        type: str
        default: null
        description: Additional arguments to pass to rapidtide. This is useful for passing any additional arguments that are
            not yet exposed through QuNex command line options. The string will be passed to rapidtide as is.
    returns: []
    origin: core
