        type: str
        default: ''
        description: The path to the folder where logs are to be stored, if other than default.
    -   name: hcp_icafix_bolds
        type: str
        default: ''
        description: List of bolds on which ICAFix was applied, with the same format as for ICAFix. Typically, this should
            be identical to the list used in the ICAFix run. If multi-run ICAFix was run with two or more groups then HCP
            MSMAll will be executed over the first specified group (and the scans listed for hcp_msmall_bolds must be limited
            to scans in the first concatenation group as well). If not provided MSMAll will assume multi-run ICAFix was executed
            with all bolds bundled together in a single concatenation called fMRI_CONCAT_ALL (i.e., same default behavior
            as in ICAFix).
    -   name: hcp_resample_concatregname
        type: str
        default: MSMAll
        description: Output name of the dedrifted registration.
    -   name: hcp_resample_regname
        type: str
        default: <hcp_msmall_outregname>_2_d40_WRN
        description: Registration sphere name.
    -   name: hcp_icafix_highpass
        type: int
        default: detailed below
        description: Value for the highpass filter, [0] for multi-run HCP ICAFix and [2000] for single-run HCP ICAFix. Should
            be identical to the value used for ICAFix.
    -   name: hcp_hiresmesh
        type: int
        default: '164'
        description: High resolution mesh node count.
    -   name: hcp_lowresmeshes
        type: str
        default: '32'
        description: Low resolution meshes node count. To provide more values separate them with commas.
    -   name: hcp_resample_reg_files
        type: str
        default: detailed below
        description: 'Comma separated paths to the spheres output from the MSMRemoveGroupDrift pipeline [<HCPPIPEDIR>/global/templates/MSMAll/<file1>,
            <HCPPIPEDIR>/global/templates/MSMAll/<file2>]. Where <file1> is equal to: DeDriftingGroup.L.sphere.DeDriftMSMAll.
            164k_fs_LR.surf.gii and <file2> is equal to DeDriftingGroup.R.sphere.DeDriftMSMAll. 164k_fs_LR.surf.gii'
    -   name: hcp_resample_maps
        type: str
        default: sulc,curvature,corrThickness,thickness
        description: Comma separated paths to maps that will have the MSMAll registration applied that are not myelin maps.
    -   name: hcp_resample_myelinmaps
        type: str
        default: MyelinMap,SmoothedMyelinMap
        description: Comma separated paths to myelin maps.
    -   name: hcp_bold_smoothFWHM
        type: int
        default: '2'
        description: Smoothing FWHM that matches what was used in the fMRISurface pipeline.
    -   name: hcp_matlab_mode
        type: str
        default: default detailed below
        description: Specifies the Matlab version, can be 'interpreted', 'compiled' or 'octave'. Inside the container 'compiled'
            will be used, outside 'interpreted' is the default.
    -   name: hcp_icafix_domotionreg
        type: bool
        default: detailed below
        description: Whether to regress motion parameters as part of the cleaning. The default value after a single-run HCP
            ICAFix is [TRUE], while the default after a multi-run HCP ICAFix is [FALSE].
    -   name: hcp_resample_dontfixnames
        type: str
        default: NONE
        description: A list of comma separated bolds that will not have HCP ICAFix reapplied to them. Only applicable if single-run
            ICAFix was used. Generally not recommended.
    -   name: hcp_resample_inregname
        type: str
        default: NONE
        description: A string to enable multiple fMRI resolutions (e.g._1.6mm).
    -   name: hcp_resample_use_ind_mean
        type: str
        default: 'YES'
        description: Whether to use the mean of the individual myelin map as the group reference map's mean.
    -   name: hcp_resample_extractnames
        type: str
        default: NONE
        description: List of bolds and concat names provided in the same format as the hcp_icafix_bolds parameter. Defines
            which bolds to extract. Exists to enable extraction of a subset of the runs in a multi-run HCP ICAFix group into
            a new concatenated series.
    -   name: hcp_resample_extractextraregnames
        type: str
        default: NONE
        description: Extract multi-run HCP ICAFix runs for additional surface registrations, often MSMSulc
    -   name: hcp_resample_extractvolume
        type: str
        default: NONE
        description: Whether to also extract the specified multi-run HCP ICAFix from the volume data, requires hcp_resample_extractnames
            to work.
    -   name: hcp_msmall_templates
        type: str
        default: <HCPPIPEDIR>/global/templates/MSMAll
        description: Path to directory containing MSMAll template files.
    -   name: hcp_msmall_myelin_target
        type: str
        default: Q1-Q6_RelatedParcellation210.MyelinMap_BC_MSMAll_2_d41_WRN_DeDrift.32k_fs_LR.dscalar.nii
        description: Myelin map target, will use Q1-Q6_RelatedParcellation210.MyelinMap_BC_MSMAll_2_d41_WRN_DeDrift.32k_fs_LR.dscalar.nii
            by default.
