-   name: create_batch
    aliases: []
    path: qx_utilities.general.utilities.create_batch
    language: python
    call: create_batch [sessionsfolder=.] [sourcefiles=session_hcp.txt] [targetfile=processing/batch.txt] [sessions=None]
        [filter=None] [overwrite=no] [paramfile=<sessionsfolder>/specs/parameters.txt]
    description: Create a joint batch file from source files in all session folders.
    type: utility
    args:
    -   name: sessionsfolder
        type: str
        default: null
        description: The location of the <study>/sessions folder.
    -   name: sourcefiles
        type: str
        default: session_hcp.txt
        description: Comma separated names of source files to take from each specified session folder and add to batch file.
    -   name: targetfile
        type: str
        default: <study>/processing/batch.txt
        description: The path to the batch file to be generated. By default, it is created as <study>/processing/batch.txt.
    -   name: sessions
        type: str
        default: None
        description: If provided, only the specified sessions from the sessions folder will be processed. They are to be specified
            as a pipe or comma separated list, grob patterns are valid session specifiers.
    -   name: filter
        type: str
        default: None
        description: An optional parameter given as "key:value|key:value" string. Only sessions with the specified key-value
            pairs in their source files will be added to the batch file.
    -   name: overwrite
        type: str
        default: 'yes'
        description: In case that the specified batch file already exists, whether to overwrite ('yes'), abort action ('no')
            or append ('append') the found / specified sessions to the batch file. Note that previous data is deleted before
            the run, so in the case of the "yes" option and a failed command run, previous results will be lost.
    -   name: paramfile
        type: str
        default: <sessionsfolder>/specs/parameters.txt
        description: The path to the parameter file header to be used. If not explicitly provided it defaults to <sessionsfolder>/specs/parameters.txt.
            If that does not exist it will not use it.
    options: []
    returns: []
    origin: core
