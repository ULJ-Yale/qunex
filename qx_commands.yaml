        [unzip="yes"] [gzip="folder"] [verbose=yes] [overwrite="no"] [existing_structure=False] [clean_dicom_folders=False]
    description: Process sessions's DICOM or PAR/REC files and generate NIfTI files.
    type: utility
    args:
    -   name: sessionsfolder
        type: str
        default: .
        description: The base study sessions folder (e.g. WM44/sessions) where the inbox and individual session folders are.
            If not specified, the current working folder will be taken as the location of the sessionsfolder.
    -   name: sessions
        type: str
        default: ''
        description: A comma delimited string that lists the sessions to process. If master inbox folder is used, the parameter
            is optional and it can include regex patterns. In this case only those sessions identified by the pattern that
            also match with any of the patterns in the sessions list will be processed. If `masterinbox` is set to none, the
            list specifies the session folders to process, and it can include glob patterns.
    -   name: masterinbox
        type: str
        default: <sessionsfolder>/inbox/MR
        description: 'The master inbox folder with packages to process. By default masterinbox is in sessions folder: <sessionsfolder>/inbox/MR.
            If the packages are elsewhere, the location can be specified here. If set to "none", the data is assumed to already
            exist in the individual sessions'' inbox folder: <studyfolder>/<sessionsfolder>/<session id>/inbox.'
    -   name: check
        type: str
        default: any
        description: The type of check to perform when packages or session folders are identified.
    -   name: pattern
        type: null
        default: null
        description: null
    -   name: nameformat
        type: null
        default: null
        description: null
    -   name: tool
        type: str
        default: auto
        description: What tool to use for the conversion.
    -   name: parelements
        type: int
        default: '1'
        description: The number of parallel processes to use when running converting DICOM images to NIfTI files. If specified
            as 'all', all avaliable resources will be utilized.
    -   name: logfile
        type: str
        default: ''
        description: 'A string specifying the location of the log file and the columns in which packetname, subject id and
            session name information are stored. The string should specify: ``"path:<path to the log file>| packetname:<name
            of the packet extracted by the pattern>|subjectid:<the column with subjectid information>[|sessionid:<the column
            with sesion id information>]"``.'
    -   name: archive
        type: str
        default: leave
        description: What to do with a processed package.
    -   name: add_image_type
        type: int
        default: '0'
        description: Adds image type information to the sequence name (Siemens scanners). The value should specify how many
            of image type labels from the end of the image type list to add.
    -   name: add_json_info
        type: str
        default: all
        description: What sequence information to extract from JSON sidecar files and add to session.txt file. Specify a comma
            separated list of fields or 'all'. See list in session.txt file description below.
    -   name: unzip
        type: str
        default: 'yes'
        description: Whether to unzip individual DICOM files that are gzipped. Valid options are 'yes', 'no'.
    -   name: gzip
        type: str
        default: folder
        description: Whether to gzip individual DICOM files after they were processed ('file'), gzip a DICOM sequence or acquisition
            as an tar.gz archive ('folder'), or leave them ungzipped ('no'). Valid options are 'folder', 'file', 'no'.
    -   name: verbose
        type: str
        default: 'yes'
        description: Whether to provide detailed report also of packets that could not be identified and/or are not matched
            with log file.
    -   name: overwrite
        type: str
        default: 'no'
        description: Whether to overwrite existing data (yes) or not (no). Note that previous data is deleted before the run,
            so in the case of a failed command run, previous results are lost.
    -   name: existing_structure
        type: bool
        default: 'False'
        description: If the images are preorganized in folders, set this to True so QuNex will not try to reorganize them.
    -   name: clean_dicom_folders
        type: null
        default: null
        description: null
    -   name: test
        type: null
        default: null
        description: null
    options: []
    returns: []
    origin: core
