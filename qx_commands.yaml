        type: str
        default: ''
        description: Specifies a suffix to the session id if multiple variants are run, empty otherwise.
    -   name: logfolder
        type: str
        default: ''
        description: The path to the folder where logs are to be stored, if other than default.
    -   name: hcp_icafix_bolds
        type: str
        default: ''
        description: Specify a list of bolds for ICAFix. You should specify how to group/concatenate bolds together along
            with bolds, e.g. "<group1>:<boldname1>,<boldname2>| <group2>:<boldname3>,<boldname4>", in this case multi-run
            HCP ICAFix will be executed, which is the default. Instead of full bold names, you can also use bold tags from
            the batch file. If this parameter is not provided ICAFix will bundle all bolds together and execute multi-run
            HCP ICAFix, the concatenated file will be named fMRI_CONCAT_ALL. Alternatively, you can specify a comma separated
            list of bolds without groups, e.g. "<boldname1>,<boldname2>", in this case single-run HCP ICAFix will be executed
            over specified bolds. This is a legacy option and not recommended.
    -   name: hcp_icafix_highpass
        type: int
        default: detailed below
        description: Value for the highpass filter, [0] for multi-run HCP ICAFix and [2000] for single-run HCP ICAFix.
    -   name: hcp_matlab_mode
        type: str
        default: default detailed below
        description: Specifies the Matlab version, can be 'interpreted', 'compiled' or 'octave'. Inside the container 'compiled'
            will be used, outside 'interpreted' is the default.
    -   name: hcp_icafix_domotionreg
        type: str
        default: detailed below
        description: Whether to regress motion parameters as part of the cleaning. The default value for single-run HCP ICAFix
            is [TRUE], while the default for multi-run HCP ICAFix is [FALSE].
    -   name: hcp_icafix_deleteintermediates
        type: str
        default: 'FALSE'
        description: If TRUE, deletes both the concatenated high-pass filtered and non-filtered timeseries files that are
            prerequisites to FIX cleaning.
    -   name: hcp_icafix_regname
        type: str
        default: NONE
        description: Specifies surface registration name. If 'NONE' MSMSulc will be used.
    -   name: hcp_lowresmesh
        type: int
        default: '32'
        description: Specifies the low res mesh number.
    -   name: hcp_longitudinal_template
        type: str
        default: base
        description: Name of the longitudinal template.
    returns: []
    origin: core
-   name: hcp_run_qc
    aliases: []
    path: qx_utilities.hcp.process_hcp.hcp_run_qc
    language: python
    call: hcp_run_qc [... processing options]
    description: Run visual QC for a session.
