            T2w folder (e.g. ''T2w''). This lets a single command call work across many sessions. If provided but none of
            the three candidates exist, processing is aborted. Only relevant for non-human species.'
    -   name: hcp_bold_sephasezerofsbrainmask
        type: str
        default: ''
