        type: str
        default: ''
        description: Brain scale factor for motion correction (e.g. 1 for human). Passed to the HCP pipeline as ``brainscalefactor``.
            Only relevant for non-human species.
    -   name: hcp_runmode
        type: str
        default: ''
        description: 'Specify from which step to resume the processing instead of starting from the beginning. Value must
            be one of: Default, DistortionCorrection, OneStepResampling (default: Default).'
