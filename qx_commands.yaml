        type: str
        default: 'FALSE'
        description: 'Indicates whether manual edits are to be applied to the FreeSurfer outputs. If set to ''TRUE'', the
            user needs to either place the edited files in <sessions folder>/inbox/FS_edits and prepend ''<session id>_''
            to identify them, or place them in the standard FreeSurfer location themselves. The ''existing_session'' parameter
            will be set to TRUE, and ''extra_reconall'' parameters will be set as well to only run the necessary steps to
            incorporate the edits, depending on the edits present and/or specified. This option can be used for edits to control.dat,
            aseg.mgz, wm.mgz, and brainmask.mgz files. Accepted values are ''FALSE'', ''TRUE'', or a comma-separated list
            of edits to apply: ''control'', ''aseg'', ''wm'', ''brainmask''. If edits are not specified explicitly, they will
            be determined based on the files found in the FS_edits folder.'
    -   name: hcp_fs_existing_session
        type: str
        default: 'FALSE'
        description: Indicates that the command is to be run on top of an already existing analysis/subject. This excludes
            the `-i` flag from the invocation of recon-all. If set, the user needs to specify which recon-all stages to run
            using the --hcp_fs_extra_reconall parameter. Accepted values are 'TRUE' and 'FALSE'. (Please note that it will
            only be used when HCP Pipelines are used. It is not implemented in hcpmodified!)
    -   name: hcp_fs_extra_reconall
        type: str
