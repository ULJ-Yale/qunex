        description: Path to the T1 template to be used by PreFreeSurfer. By default the used template is determined through
            the resolution provided by the hcp_prefs_template_res parameter. For non-human species (hcp_species other than
            'Human') the default is taken from the species-specific NHP_NNP template folder instead of the human MNI152 templates.
    -   name: hcp_prefs_t1templatebrain
        type: str
        default: null
        description: Path to the T1 brain template to be used by PreFreeSurfer. By default the used template is determined
            through the resolution provided by the hcp_prefs_template_res parameter.
    -   name: hcp_prefs_t1template2mm
        type: str
        default: null
        description: Path to the T1 2mm template to be used by PreFreeSurfer. By default the used template is HCP's MNI152_T1_2mm.nii.gz.
    -   name: hcp_prefs_t2template
        type: str
        default: null
        description: Path to the T2 template to be used by PreFreeSurfer. By default the used template is determined through
            the resolution provided by the hcp_prefs_template_res parameter.
    -   name: hcp_prefs_t2templatebrain
        type: str
        default: null
        description: Path to the T2 brain template to be used by PreFreeSurfer. By default the used template is determined
            through the resolution provided by the hcp_prefs_template_res parameter.
    -   name: hcp_prefs_t2template2mm
        type: str
        default: null
        description: Path to the T2 2mm template to be used by PreFreeSurfer. By default the used template is HCP's MNI152_T2_2mm.nii.gz.
    -   name: hcp_prefs_templatemask
        type: str
        default: null
        description: Path to the template mask to be used by PreFreeSurfer. By default the used template mask is determined
            through the resolution provided by the hcp_prefs_template_res parameter.
    -   name: hcp_prefs_template2mmmask
        type: str
        default: null
        description: Path to the template mask to be used by PreFreeSurfer. By default the used 2mm template mask is HCP's
            MNI152_T1_2mm_brain_mask_dil.nii.gz.
    -   name: hcp_prefs_fnirtconfig
        type: str
        default: null
        description: Path to the used FNIRT config. Set to the HCP's T1_2_MNI152_2mm.cnf by default.
    -   name: use_sequence_info
        type: str
        default: all
        description: A pipe, comma or space separated list of inline sequence information to use in preprocessing of specific
            image modalities.
    -   name: hcp_sephasepos2
        type: str
        default: ''
        description: Label for the positive image of the second Spin Echo Field Map pair.
    -   name: hcp_sephaseneg2
        type: str
        default: ''
        description: Label for the negative image of the second Spin Echo Field Map pair.
    -   name: hcp_senum2
        type: str
        default: ''
        description: Number of the second Spin Echo Field Map pair to use for SE2. QuNex will use the files in the SpinEchoFieldMap[N]
            folder from the HCP unprocessed folder.
    -   name: hcp_species
        type: str
        default: ''
        description: 'Species (default: Human). When set to a non-human species QuNex switches to the species-specific NHP
            templates (from the NHP_NNP template folder) and requires hcp_prefs_template_res to be set explicitly. Recognized
            non-human species are: Chimp, MacaqueCyno, MacaqueRhesus, MacaqueSnow, MacaqueMac30BS, Marmoset, NightMonkey.'
    -   name: hcp_runmode
        type: str
        default: ''
        description: 'Specify from which step to resume the processing instead of starting from the beginning. Value must
            be one of: Default, ACPCAlignment, BrainExtraction, T2wToT1wRegAndBiasCorrection, AtlasRegistration (default:
            Default).'
    -   name: hcp_truepatientposition
        type: str
        default: ''
        description: 'True patient position (default: HFS).'
    -   name: hcp_scannerpatientposition
        type: str
        default: ''
        description: 'Scanner patient position (default: HFS).'
    -   name: hcp_betcenter
        type: str
        default: ''
        description: 'Center coordinates for BET (default: 45,55,39).'
    -   name: hcp_betradius
        type: str
        default: ''
        description: 'Radius for BET (default: 75).'
    -   name: hcp_betfraction
        type: str
        default: ''
        description: 'Fraction for BET (default: 0.3).'
    -   name: hcp_bettop2center
        type: str
        default: ''
        description: 'Distance from top to center for BET (default: 86).'
    -   name: hcp_brainextract
        type: str
        default: ''
        description: 'Brain extraction method (default: INVIVO).'
    -   name: hcp_use_t2w_phase_zero
        type: str
