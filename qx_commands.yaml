    path: qx_utilities.hcp.process_hcp.hcp_long_msmall
    language: python
    call: hcp_long_msmall [... processing options]
    description: Run the HCP Longitudinal MSMAll Pipeline (MSMAllPipeline.sh with the longitudinal setup).
    type: processing.subject
    args:
    -   name: sinfo
        type: null
        default: null
        description: null
    -   name: options
        type: null
        default: null
        description: null
    -   name: overwrite
        type: null
        default: null
        description: null
    -   name: thread
        type: null
        default: null
        description: null
    options:
    -   name: batchfile
        type: str
        default: ''
        description: The batch.txt file with all the sessions information.
    -   name: sessionsfolder
        type: str
        default: .
        description: The path to the study/sessions folder, where the imaging data is supposed to go.
    -   name: parsessions
        type: int
        default: '1'
        description: How many sessions to run in parallel.
    -   name: hcp_suffix
        type: str
        default: ''
        description: Specifies a suffix to the session id if multiple variants are run, empty otherwise.
    -   name: logfolder
        type: str
        default: ''
        description: The path to the folder where logs are to be stored, if other than default.
    -   name: hcp_icafix_bolds
        type: str
        default: ''
        description: List of bolds on which ICAFix was applied, with the same format as for ICAFix. Typically, this should
            be identical to the list used in the ICAFix run. If multi-run ICAFix was run with two or more groups then HCP
            MSMAll will be executed over the first specified group (and the scans listed for hcp_msmall_bolds must be limited
            to scans in the first concatenation group as well). If not provided MSMAll will assume multi-run ICAFix was executed
            with all bolds bundled together in a single concatenation called fMRI_CONCAT_ALL (i.e., same default behavior
            as in ICAFix).
    -   name: hcp_msmall_bolds
        type: str
        default: detailed below
        description: A comma separated list that defines the bolds that will be used in the computation of the MSMAll registration.
            Typically, this should be limited to resting-state scans. Specified bolds have to be a subset of bolds used from
            the hcp_icafix_bolds parameter [if not specified all bolds specified in hcp_icafix_bolds will be used, which is
            probably NOT what you want to do if hcp_icafix_bolds includes non-resting-state scans].
    -   name: hcp_icafix_highpass
        type: int
        default: detailed below
        description: Value for the highpass filter, [0] for multi-run HCP ICAFix and [2000] for single-run HCP ICAFix. Should
            be identical to the value used for ICAFix.
    -   name: hcp_msmall_outfmriname
        type: str
        default: rfMRI_REST
        description: The name which will be given to the concatenation of scans specified by the hcp_msmall_bold parameter.
    -   name: hcp_msmall_templates
        type: str
        default: <HCPPIPEDIR>/global/templates/MSMAll
        description: Path to directory containing MSMAll template files.
    -   name: hcp_msmall_outregname
        type: str
        default: MSMAll_InitialReg
        description: Output registration name.
    -   name: hcp_hiresmesh
        type: int
        default: '164'
        description: High resolution mesh node count.
    -   name: hcp_lowresmesh
        type: int
        default: '32'
        description: Low resolution mesh node count.
    -   name: hcp_regname
        type: str
        default: MSMSulc
        description: Input registration name.
    -   name: hcp_matlab_mode
        type: str
        default: default detailed below
        description: Specifies the Matlab version, can be 'interpreted', 'compiled' or 'octave'. Inside the container 'compiled'
            will be used, outside 'interpreted' is the default.
    -   name: hcp_msmall_procstring
        type: str
        default: <hcp_cifti_tail>_hp<hcp_highpass>_clean
        description: Identification for FIX cleaned dtseries to use.
    -   name: hcp_msmall_myelin_target
        type: str
        default: Q1-Q6_RelatedParcellation210.MyelinMap_BC_MSMAll_2_d41_WRN_DeDrift.32k_fs_LR.dscalar.nii
        description: Myelin map target, will use Q1-Q6_RelatedParcellation210.MyelinMap_BC_MSMAll_2_d41_WRN_DeDrift.32k_fs_LR.dscalar.nii
            by default.
    returns: []
    origin: core
