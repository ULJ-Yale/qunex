    id: core
commands:
-   name: batch_tag2namekey
    aliases: []
    path: qx_utilities.general.utilities.batch_tag2namekey
    language: python
    call: batch_tag2namekey filename=<path to batch file> sessionid=<session id> bolds=<bold specification string> [output="number"]
        [prefix="BOLD_"]
    description: Extract the data for the specified session and return the list of bold numbers or names.
    type: utility
    args:
    -   name: filename
        type: str
        default: null
        description: Path to batch.txt file.
    -   name: sessionid
        type: str
        default: null
        description: Session id to look up.
    -   name: bolds
        type: str
        default: null
        description: Which bold images (as they are specified in the batch.txt file) to process. It can be a single type (e.g.
            'task'), a pipe separated list (e.g. 'WM|Control|rest') or 'all' to process all.
    -   name: output
        type: str
        default: null
        description: Whether to output numbers ('number') or bold names ('name'). In the latter case the name will be extracted
            from the 'filename' specification, if provided in the batch file, or '<prefix>[N]' if 'filename' is not specified.
            Default is 'number'.
    -   name: prefix
        type: str
        default: null
        description: The default prefix to use if a filename is not specified in the batch file. Default is 'BOLD_'.
    options: []
    returns: []
    origin: core
-   name: bruker_to_dicom
    aliases: []
    path: qx_utilities.general.bruker.bruker_to_dicom
    language: python
    call: bruker_to_dicom [... processing options]
    description: Convert bruker data into DICOM format for QuNex import.
    type: utility
    args:
    -   name: sessionsfolder
        type: str
        default: .
        description: The sessions folder where all the sessions are to be mapped to. It should be a folder within the <study
            folder>.
    -   name: inbox
        type: str
        default: <sessionsfolder>/inbox/bruker
        description: The location of the folder with bruker datasets.
    -   name: sessions
        type: str
        default: ''
        description: 'An optional parameter that specifies a comma or pipe separated list of sessions from the inbox folder
            to be processed. Regular expression patterns can be used. If provided, only folders within the inbox that match
            the list of sessions will be processed. Note: the session will match if the string is found within the folder
            name. So ''S01'' with match any folder that contains the string ''S01''!'
    -   name: archive
        type: str
        default: leave
        description: 'What to do with bruker data once it is converted. Options are:'
    -   name: parelements
        type: int
        default: '1'
        description: How many parallel processes to run the conversion with.
    options: []
    returns: []
    origin: core
