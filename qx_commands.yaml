        type: str
        default: PA
        description: The direction of unwarping for positive phase. Can be AP, PA, LR, or RL. Negative phase is set automatically
            based on this setting.
    -   name: hcp_dwi_gdcoeffs
        type: str
        default: NONE
        description: A path to a file containing gradient distortion coefficients, alternatively a string describing multiple
            options (see below), or "NONE", if not used.
    -   name: hcp_dwi_topupconfig
        type: str
        default: $HCPPIPEDIR/global/config/b02b0.cnf
        description: A full path to the topup configuration file to use.
    -   name: hcp_dwi_dof
        type: int
        default: '6'
        description: Degrees of Freedom for post eddy registration to structural images.
    -   name: hcp_dwi_b0maxbval
        type: int
        default: '50'
        description: Volumes with a bvalue smaller than this value will be considered as b0s.
    -   name: hcp_dwi_combinedata
        type: int
        default: '1'
        description: 'If JAC resampling has been used in eddy, this value determines what to do with the output file:'
    -   name: hcp_dwi_selectbestb0
        type: flag
        default: null
        description: If set selects the best b0 for each phase encoding direction to pass on to topup rather than the default
            behaviour of using equally spaced b0's throughout the scan. The best b0 is identified as the least distorted (i.e.,
            most similar to the average b0 after registration). The flag is not set by default.
    -   name: hcp_dwi_extraeddyarg
        type: str
        default: ''
        description: A string specifying additional arguments to pass to the DiffPreprocPipeline_Eddy.sh script and subsequently
            to the run_eddy.sh script and finally to the command that actually invokes the eddy binary. The string is to be
            written as a contiguous set of arguments to be added. Each argument needs to be provided together with dashes
            if it needs them. To provide multiple arguments divide them with the pipe (|) character, e.g. --hcp_dwi_extraeddyarg="--niter=8|--nvoxhp=2000".
    -   name: hcp_dwi_name
        type: str
