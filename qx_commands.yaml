        description: Indicates whether to add T2-weighted image as a phase zero volume, for bright-CSF T2w contrast acquisition
            types (e.g., not FLAIR). Accepted values are 'TRUE' and 'FALSE'.
    -   name: hcp_bias_field_sigma_no_t2w
