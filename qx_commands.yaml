            session or a multi-session dataset, or a folder that contains a compressed package. For instance the user can
            specify "<path>/<bids_file>.zip" or "<path>" to a folder that contains multiple packages. The default location
            where the command will look for a BIDS dataset is.'
    -   name: sessions
        type: str
        default: null
        description: An optional parameter that specifies a comma or pipe separated list of sessions from the inbox folder
            to be processed. Glob patterns can be used. If provided, only packets or folders within the inbox that match the
            list of sessions will be processed. If `inbox` is a file `sessions` has to be a list of session specifications,
            only those sessions that match the list will be processed. If `inbox` is a valid bids datastructure folder or
            archive, then the sessions can be specified either in `<subject id>[_<session name>]` format or as explicit `sub-<subject
            id>[/ses-<session name>]` names.
    -   name: action
        type: str
        default: link
        description: 'How to map the files to QuNex structure. These are the options:'
    -   name: overwrite
