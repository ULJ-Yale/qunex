            model as `somefile.RData`, `somefile.pyfix_model`, or a pyfix built-in model without extension. You can provide
            a full path to a file or just a filename if the file is in the FSL training_files folder. [HCP_hp<high-pass>.RData]
            for single-run HCP ICAFix and [HCP_Style_Single_Multirun_Dedrift.RData] for multi-run HCP ICAFix.
    -   name: hcp_icafix_threshold
        type: int
        default: '10'
        description: ICAFix threshold that controls the sensitivity/specificity tradeoff.
    -   name: hcp_icafix_deleteintermediates
        type: str
        default: 'FALSE'
        description: If True, deletes both the concatenated high-pass filtered and non-filtered timeseries files that are
            prerequisites to FIX cleaning.
    -   name: hcp_icafix_fallbackthreshold
        type: int
        default: '0'
        description: If greater than zero, reruns icadim on any run with a VN mean more than this amount greater than the
            minimum VN mean.
    -   name: hcp_config
        type: str
        default: ''
        description: 'Path to the HCP config file where additional parameters can be specified. For hcp_icafix, these parametersa
            are: volwisharts, ciftiwisharts and icadimmode.'
    -   name: hcp_icafix_postfix
        type: str
        default: 'TRUE'
        description: Whether to automatically run HCP PostFix if HCP ICAFix finishes successfully.
    -   name: hcp_icafix_processingmode
        type: str
        default: ''
        description: HCPStyleData (default) or LegacyStyleData, controls whether --hcp_icadim_mode=fewtimepoints is allowed.
    -   name: hcp_icafix_icadim_mode
        type: str
        default: default
        description: 'Choose how to run icaDim: "default" - start with a VN dimensionality of 1 and rerun until convergence
            "fewtimepoints" - start with a VN dimensionality of half the timepoints, do not iterate.'
    -   name: hcp_icafix_parallel_limit
        type: int
        default: '-1'
        description: How many melodic commands to run in parallel (local, not cluster-distributed) during individual projection
            and cleanup, defaults to all detected physical cores.
    -   name: hcp_icafix_concatenate_only
        type: flag
        default: null
        description: When set, the script stops after the concatination step, e.g., for use in experimental alternative multi-run
            denoising.
    -   name: hcp_reuse_existing_ica
        type: str
        default: 'FALSE'
        description: Whether to execute only the FIX step of the pipeline and reuse the previous ICA results.
    -   name: hcp_fix_backup
        type: str
        default: ''
        description: If provided, the previous FIX solution is backed up to the specified folder, in case hcp_reuse_existing_ica
            is used.
    -   name: hcp_t1wtemplatebrain
        type: str
        default: ''
        description: Path to the T1w template brain used by pyfix. Not set by default, you can either set a path or set to
            "auto" to set as <HCPPIPEDIR>/global/templates/MNI152_T1_<RES>mm_brain.nii.gz.
    -   name: hcp_ica_method
        type: str
        default: MELODIC
        description: MELODIC or ICASSO. Use single-pass MELODIC (default) or multi-pass ICASSO consensus method for ICA.
    -   name: hcp_legacy_fix
        type: flag
        default: null
        description: Whether to use the legacy MATLAB fix instead of the new pyfix.
    -   name: hcp_vol_wisharts
        type: int
        default: '2'
        description: Number of wisharts to fit to volume data in icaDim.
    -   name: hcp_cifti_wisharts
        type: int
        default: '3'
        description: Number of wisharts to fit to CIFTI data in icaDim.
    -   name: hcp_icadim_mode
        type: str
        default: default
        description: 'Choose how to run icaDim: "default" - start with a VN dimensionality of 1 and rerun until convergence
            "fewtimepoints" - start with a VN dimensionality of half the timepoints, do not iterate.'
    returns: []
    origin: core
