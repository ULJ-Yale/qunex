-   name: hcp_post_freesurfer
    aliases: []
    path: qx_utilities.hcp.process_hcp.hcp_post_freesurfer
    language: python
    call: hcp_post_freesurfer [... processing options]
    description: Run the PostFS step of the HCP Pipeline (PostFreeSurferPipeline.sh).
    type: processing.session
    args:
    -   name: sinfo
        type: null
        default: null
        description: null
    -   name: options
        type: null
        default: null
        description: null
    -   name: overwrite
        type: str
        default: 'no'
        description: Whether to overwrite existing data (yes) or not (no). Note that previous data is deleted before the run,
            so in the case of a failed command run, previous results are lost.
    -   name: thread
        type: null
        default: null
        description: null
    options:
    -   name: batchfile
        type: str
        default: ''
        description: The batch.txt file with all the sessions information.
    -   name: sessionsfolder
        type: str
        default: .
        description: The path to the study/sessions folder, where the imaging data is supposed to go.
    -   name: parsessions
        type: int
        default: '1'
        description: How many sessions to run in parallel.
    -   name: hcp_suffix
        type: str
        default: ''
        description: Specifies a suffix to the session id if multiple variants are run, empty otherwise.
    -   name: logfolder
        type: str
        default: ''
        description: The path to the folder where logs are to be stored, if other than default.
    -   name: hcp_processing_mode
        type: str
        default: HCPStyleData
        description: Controls whether the HCP acquisition and processing guidelines should be treated as requirements ('HCPStyleData')
            or if additional processing functionality is allowed ('LegacyStyleData'). In this case running processing w/o
            a T2w image.
    -   name: hcp_folderstructure
        type: str
        default: hcpls
        description: If set to 'hcpya' the folder structure used in the initial HCP Young Adults study is used. Specifically,
            the source files are stored in individual folders within the main 'hcp' folder in parallel with the working folders
            and the 'MNINonLinear' folder with results. If set to 'hcpls' the folder structure used in the HCP Life Span study
            is used. Specifically, the source files are all stored within their individual subfolders located in the joint
            'unprocessed' folder in the main 'hcp' folder, parallel to the working folders and the 'MNINonLinear' folder.
    -   name: hcp_filename
        type: str
        default: automated
        description: How to name the BOLD files once mapped intothe hcp input folder structure. The default ('automated')
            will automatically name each file by their number (e.g. BOLD_1). The alternative ('userdefined') is to use the
            file names, which can be defined by the user prior to mapping (e.g. rfMRI_REST1_AP).
    -   name: hcp_t2
        type: str
        default: t2
        description: '''NONE'' if no T2w image is available and the preprocessing should be run without them, anything else
            otherwise. ''NONE'' is only valid if ''LegacyStyleData'' processing mode was specified.'
    -   name: hcp_surfatlasdir
        type: str
        default: null
        description: Surface atlas directory.
    -   name: hcp_grayordinatesres
        type: int
        default: '2'
        description: The resolution of the volume part of the grayordinate representation in mm.
    -   name: hcp_grayordinatesdir
        type: str
        default: HCP "91282_Greyordinates"
        description: Grayordinates space directory.
    -   name: hcp_subcortgraylabels
        type: str
        default: HCP "FreeSurferSubcorticalLabelTableLut.txt"
        description: The location of FreeSurferSubcorticalLabelTableLut.txt.
    -   name: hcp_refmyelinmaps
        type: str
        default: HCP "Conte69.MyelinMap_BC.164k_fs_LR.dscalar.nii"
        description: Group myelin map to use for bias correction.
    -   name: hcp_hiresmesh
        type: int
        default: '164'
        description: The number of vertices for the high resolution mesh of each hemisphere (in thousands).
    -   name: hcp_lowresmesh
        type: int
        default: '32'
        description: The number of vertices for the low resolution mesh of each hemisphere (in thousands).
    -   name: hcp_regname
        type: str
        default: MSMSulc
        description: The registration used, FS or MSMSulc.
    -   name: hcp_inflatescale
        type: int
        default: '1'
        description: Inflate extra scale parameter.
    -   name: hcp_fs_ind_mean
        type: str
        default: 'YES'
        description: Whether to use the mean of the subject's myelin map as reference map's myelin map mean, YES or NO, defaults
            to YES.
    -   name: hcp_freesurfer_labels
        type: str
        default: ${HCPPIPEDIR}/global/config/FreeSurferAllLut.txt
        description: Path to the location of the FreeSurfer look up table file.
    -   name: hcp_thickness_regression
        type: str
        default: BOTH
        description: Wwhether to use the updated curvature-thickness regression, set to 'OLD', 'NEW' or 'BOTH', defaults to
            'BOTH'.
    -   name: hcp_species
        type: str
        default: Human
        description: Target species for processing. When set to anything other than 'Human' (case-insensitive), the non-human
            primate (NHP) variant of PostFreeSurfer processing is engaged and the species-specific parameters below are passed
            to the pipeline.
    -   name: hcp_myelin_volume_fwhm
        type: float
        default: detected
        description: Myelin mapping volume smoothing FWHM. Only relevant for non-human species (when hcp_species is not 'Human').
            When unset the HCP pipeline default is used.
    -   name: hcp_myelin_surface_fwhm
        type: float
        default: detected
        description: Myelin mapping surface smoothing FWHM. Only relevant for non-human species (when hcp_species is not 'Human').
            When unset the HCP pipeline default is used.
    -   name: hcp_msmsulc_conf
        type: str
        default: detected
        description: MSMSulc configuration. Only relevant for non-human species (when hcp_species is not 'Human'). When unset
            the HCP pipeline default is used.
    -   name: hcp_flatmap_root_name
        type: str
        default: detected
        description: Flat map root name. Only relevant for non-human species (when hcp_species is not 'Human'). When unset
            the HCP pipeline default is used.
    returns: []
    origin: core
