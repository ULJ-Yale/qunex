            the sequence information. Options are:'
    -   name: merge_multi_echo
        type: str
        default: 'no'
        description: Whether to merge multi-echo BOLD and sbref files into a single 4D image. If set to 'yes', the echoes
            will be merged and an entry will be created in the session file.
