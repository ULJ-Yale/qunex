Description: |
  The `create_list` command generates a `.list` formatted file that specifies sessions and their associated data files
  for use in QuNex processing and analysis pipelines. This flexible command enables you to:

  * Create lists of BOLD fMRI files across multiple sessions
  * Include concatenated timeseries (conc files), event files (fidl), GLM results, and ROI masks
  * Filter sessions based on batch file metadata (e.g., only include control group baseline scans)
  * Support multiple parallel workflows with different preprocessing variants

  ## List File Format

  The generated list file contains entries in the format:
  ```
  session: <session_id>
      file: <path_to_bold_file>
      conc: <path_to_conc_file>
      fidl: <path_to_fidl_file>
      glm: <path_to_glm_file>
      roi: <path_to_roi_file>
  ```

  Each session can have multiple file types specified, and you can include multiple BOLD runs per session.

  ## Use Cases

  * **Creating input for fc_compute**: List BOLD files and conc files for functional connectivity analysis
  * **GLM analysis**: List sessions with their event files (fidl) and output GLM files
  * **ROI extraction**: Combine BOLD files with parcellation masks for timeseries extraction
  * **Quality control**: Generate lists of specific preprocessing variants to compare results

Source specification:
  description: >
    In this section we define the parameters required to locate and select the sessions that should be included in the
    generated list file.

  sessionsfolder:
    optional: no
    type: string
    default: "."
    placeholder: "/mystudy/sessions"
    description: "Study sessions folder containing individual session subfolders."

  batchfile:
    optional: yes
    type: string
    default: ""
    placeholder: "/mystudy/processing/batch.txt"
    description: |
      Path to a batch file containing session metadata. When provided, enables:

      * Filtering sessions using the `filter` parameter
      * Using BOLD task tags (e.g., "rest", "task") instead of numbers in the `bolds` parameter
      * Including only sessions listed in the batch file

      If not provided, all sessions in `sessionsfolder` with an `images` subfolder will be included.

  sessions:
    optional: yes
    type: string
    default: ""
    placeholder: "s001_s1, s002_s1"
    description: >
      If only specific sessions are to be included, provide a comma-separated list of specific sessions to include when
      generating the list file (e.g., "s001_s1, s002_s2").
      If not specified, all sessions in the `sessionsfolder` will be included. The sessions must match those defined in
      the `batchfile` if provided. A glob pattern (e.g., "s001_*") can also be used to include multiple sessions.

  filter:
    optional: yes
    type: string
    default: ""
    placeholder: "<key>:<value>|<key>:<value>"
    description: >
      If only specific sessions matching certain criteria are to be included, provide a pipe (`|`) separated list of
      <key>:<value> pairs to only include those sessions in the list, which match the specified requirements. For
      instance, to include only sessions from the control group, use `group:control`. The keys and values used
      have to be present in the `batch.txt` file. If a session does not have the specified key, it will be excluded.
      Only sessions matching all specified criteria will be included in the generated list file.

  bold_variant:
    optional: yes
    type: string
    default: ""
    placeholder: ""
    description: >
      By default, the files for each session are assumed to be in the standard location within each session folder,
      which is `<session folder>/images/functional/`. QuNex supports having multiple variants of the functional images
      in this case, these would be present in a folder with a specified `bold_variant` tail. For example, if `bold_variant`
      is set to `_icafix`, the command will look for image files in the folder
      `<session folder>/images/functional_icafix/`. If no `bold_variant` is specified, the default location is used.

  img_suffix:
    optional: yes
    type: string
    default: ""
    placeholder: ""
    description: >
      Similar to `bold_variant`, this parameter allows specifying a tail that is added to the `<session folder>/images`
      folder. This functionality enables multiple parallel workflows within the same session structure. For example, if
      `img_suffix` is set to `_nodc` (possibly denoting that no distortion correction was used when preprocessing the
      images), the command will look for image files in folders named `<session folder>/images_nodc/functional/`.
      If not specified, the command will look for image files in the standard location within each session folder.


Input specification:
  description: >
    In this section we define the parameters required to identify the relevant files within each session that should be
    included in the list file.

  bolds:
    optional: yes
    type: string
    default: ""
    placeholder: "rest, task"
    description: |
      Specify which BOLD runs to include in the list. Can be provided as:

      * **Numbers**: `1,2,3` - Include specific BOLD run numbers (e.g., bold1, bold2, bold3)
      * **Tags**: `rest, task` - Include runs with specific tags from the batch file (requires `batchfile` parameter)
      * **Mixed**: `1, rest, 3` - Combine numbers and tags
      * **All**: `all` - Include all BOLD runs listed in the batch file

      If not specified, no BOLD files will be included in the list. Separators can be commas, spaces, or pipes.

  boldname:
    optional: yes
    type: string
    default: "bold"
    placeholder: "bold"
    description: >
      In QuNex, fMRI images are typically named as `bold[N]`, where `[N]` is a number indicating the run index. If the
      functional images in your study use a different naming convention, specify the name that is used to identify them.
      For example, if the images are named `func1`, `func2`, etc., set `boldname` to `func`.

  bold_tail:
    optional: yes
    type: string
    default: ".nii.gz"
    placeholder: ".nii.gz"
    description: |
      File extension (tail) that identifies which version of BOLD files to include. Multiple versions often exist
      in the same folder with different processing stages or formats. Examples:

      * `.nii.gz` - Raw NIFTI files (default)
      * `_Atlas.dtseries.nii` - Surface-mapped CIFTI dense timeseries
      * `_Atlas_s_hpss_res-mVWMWB1d.dtseries.nii` - Preprocessed CIFTI with specific pipeline steps
      * `.nii` - Uncompressed NIFTI files

      The tail is appended after the BOLD name and number: `<boldname><number><bold_tail>`

  conc:
    optional: yes
    type: string
    default: ""
    placeholder: "bold_CANP_ptseries_axcpt.conc"
    description: |
      Filename of a conc (concatenation) file to include for each session. Conc files specify how multiple
      BOLD runs are concatenated for analysis.

      The file should be located in: `<session>/images<img_suffix>/functional<bold_variant>/conc/`

      Example entry `bold_CANP_ptseries_axcpt.conc` would be included in list file as:
      ```
      conc: /mystudy/sessions/s001/images/functional/conc/bold_CANP_ptseries_axcpt.conc
      ```

      If not specified, no conc files will be included.

  fidl:
    optional: yes
    type: string
    default: ""
    placeholder: "axcpt.fidl"
    description: |
      Filename of a fidl (fMRI event description language) file to include for each session. Fidl files define
      task timing and conditions for event-related fMRI analysis.

      The file should be located in: `<session>/images<img_suffix>/functional<bold_variant>/events/`

      Example entry `axcpt.fidl` would be included in list file as:
      ```
      fidl: /mystudy/sessions/s001/images/functional/events/axcpt.fidl
      ```

      If not specified, no fidl files will be included.

  glm:
    optional: yes
    type: string
    default: ""
    placeholder: "bold_Atlas_conc_axcpt_res-e_v1_Bcoeff.dscalar.nii"
    description: |
      Filename of a GLM (general linear model) results file to include for each session. GLM files
      contain beta coefficient maps from task analyses generated by `preprocess_conc` command.

      The file should be located in: `<session>/images<img_suffix>/functional<bold_variant>/`

      Example entry `bold_Atlas_conc_axcpt_res-e_v1_Bcoeff.dscalar.nii` would be included in list file as:
      ```
      glm: /mystudy/sessions/s001/images/functional/bold_Atlas_conc_axcpt_res-e_v1_Bcoeff.dscalar.nii
      ```

      If not specified, no GLM files will be included.

  roi:
    optional: yes
    type: string
    default: ""
    placeholder: "segmentation/freesurfer/mri/aparc+aseg_bold.nii.gz"
    description: |
      Relative path (from the `images` folder) to an ROI (region of interest) file to include for each session.
      ROI files are typically parcellation or segmentation masks used for extracting regional timeseries.

      The file should be located under: `<session>/images<img_suffix>/`

      Common examples:
      * `segmentation/freesurfer/mri/aparc+aseg_bold.nii.gz` - FreeSurfer parcellation
      * `segmentation/hcp/fsaverage_LR32k/aparc.32k_fs_LR.dlabel.nii` - HCP surface parcellation

      Example entry `segmentation/freesurfer/mri/aparc+aseg_bold.nii.gz` would be included in list file as:
      ```
      roi: /mystudy/sessions/s001/images/segmentation/freesurfer/mri/aparc+aseg_bold.nii.gz
      ```

      If not specified, no ROI files will be included.

Output specification:
  description: >
    Define the location of the generated list file and additional processing parameters.

  listfile:
    optional: yes
    type: string
    default: ""
    placeholder: "/mystudy/processing/lists/mylist.list"
    description: |
      Full path (including filename) for the generated list file.

      If not specified, the list file will be created at:
      ```
      <studyfolder>/processing/lists/sessions.list
      ```

      The file extension `.list` is conventional but not required.

  overwrite:
    optional: yes
    type: options
    options: "yes,no,append"
    default: "no"
    description: |
      Specifies whether to overwrite an existing list file, append to it, or not overwrite it.

      * `yes`: Overwrite any existing list file at the specified location.
      * `no`: Do not overwrite an existing list file; if it exists, the command will exit with an error.
      * `append`: Append new entries to the existing list file if it exists; otherwise, create a new file.

  check:
    optional: yes
    type: options
    options: "yes,no,warn,present"
    default: "yes"
    description: |
      Specifies whether to check for the existence of the specified files for each session before including them in the list file.

      * `yes`: Verify that each specified file exists in the corresponding session folder. If a file is missing, abort processing and report an error.
      * `no`: Do not check for file existence; include all specified sessions and files in the list file regardless of whether the files actually exist.
      * `warn`: Check for file existence, but only issue a warning if files are missing; still include the sessions and the specified files in the list file.
      * `present`: Do check for presence of the specified files. Only include sessions in the list file if all specified files exist; skip sessions with missing files without issuing an error.