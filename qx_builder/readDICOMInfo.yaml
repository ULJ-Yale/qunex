Description: |
  # Read DICOM Info

  The `readDICOMInfo` command reads and extracts basic information from DICOM (Digital Imaging and Communications in Medicine) files.

  DICOM is the international standard format for medical images and related information. This command parses DICOM files and extracts key imaging parameters needed for neuroimaging data organization and processing.

  ## What It Does

  This command reads a DICOM file and extracts standardized imaging parameters including:

  - **Session information**: Patient ID, study ID, exam date/time
  - **Series identifiers**: Series number, series description, protocol name
  - **Timing parameters**: TR (repetition time), TE (echo time)
  - **Volume structure**: Number of frames, slices, volumes
  - **Image metadata**: Image type, SOP Instance UID
  - **Scanner information**: Institution name, manufacturer details

  The command handles multiple DICOM formats and vendor-specific tags, including special handling for:
  - Standard DICOM tags
  - Philips private tags (0x2001, 0x2005 series)
  - Siemens private tags (0x0019 series)

  ## Output Information

  The command extracts and returns a dictionary with the following standardized fields:

  - `sessionid` - Patient ID or Study ID
  - `seriesNumber` - Unique series identifier
  - `seriesDescription` - Protocol/sequence name
  - `TR` - Repetition time in milliseconds
  - `TE` - Echo time in milliseconds
  - `frames` - Number of timepoints/dynamics
  - `directions` - Number of gradient directions (for diffusion)
  - `volumes` - Total number of volumes
  - `slices` - Number of slices per volume
  - `datetime` - Study date and time
  - `SOPInstanceUID` - DICOM instance unique identifier
  - `ImageType` - Type of image (e.g., ORIGINAL, DERIVED)
  - `dicom` - Full DICOM object for advanced access

  ## Use Cases

  - **Data import**: Extract metadata when importing scanner data
  - **Session organization**: Populate session files with scan parameters
  - **Quality control**: Verify acquisition parameters
  - **Series identification**: Distinguish between different scan types
  - **BIDS conversion**: Extract metadata for BIDS sidecar JSON files

  ## Example Usage

  ```bash
  qunex readDICOMInfo \
      --filename=/data/raw/sub-001/series_003/IM-0001-0001.dcm
  ```

  This will read the DICOM file and return a dictionary with all extracted imaging parameters and the full DICOM header object.

Parameters:
  filename:
    optional: no
    type: string
    placeholder: "path/to/file.dcm"
    description: |
      **The path to the DICOM file to read**.

      This should be a valid DICOM file, typically with extensions like `.dcm`, `.IMA`, or no extension.

      DICOM files contain both image data and metadata in a standardized format. This command reads the metadata/header information.

      The file must exist and be a valid DICOM file, otherwise the command will fail with an error.

      **Example values:**
      - `/data/raw/sub-001/T1w/IM-0001-0001.dcm`
      - `../scanner_data/fMRI_BOLD/1.3.12.2.1107.5.2.43.dcm`
      - `./series_005/image_00001.IMA`
      - `/mnt/dicom/study123/series002/0001`
